name: Update shared WUMI public data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,14 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wumi-public-feed-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public FX and preserve safe placeholders
        run: python scripts_collect.py
      - name: Test collector contracts
        run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
