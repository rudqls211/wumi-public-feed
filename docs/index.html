<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WUMI 공용 데이터 상태</title><style>body{font-family:system-ui, sans-serif;max-width:600px;margin:40px auto;padding:0 20px;color:#233}section{margin:14px 0;padding:16px;border:1px solid #dde4ee;border-radius:16px}small{color:#667}strong{font-size:1.3rem}button{padding:10px 16px;border-radius:12px;border:1px solid #bbb;background:white}</style></head><body><h1>WUMI 공용 데이터</h1><p>개인 계좌·보유종목 데이터는 서버에 전송하지 않습니다.</p><button onclick="load()">새로 받기</button><div id="result">조회 준비 중</div><script>async function load(){let box=document.getElementById("result");box.textContent="불러오는 중...";try{let kinds=["fx","quotes","dividends","tax_policy","holidays"];let html="";for(let name of kinds){let r=await fetch("data/"+name+".json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);let d=await r.json();let rates=name==="fx"?Object.entries(d.data||{}).map(([k,v])=>"<p>"+k+" : "+Number(v.krw_per_unit).toLocaleString("ko-KR")+"원</p>").join(""):"";if(name==="dividends"&&d.data&&d.data.us){for(const [ticker,v] of Object.entries(d.data.us)){if(!/^[A-Z][A-Z0-9.-]{0,11}$/.test(ticker))continue;const url="https://smarterdividends.com/stocks/"+ticker;if(v.source_url!==url)continue;const ex=/^\\d{4}-\\d{2}-\\d{2}$/.test(v.next_ex_date||"")?v.next_ex_date:"미발표";const pay=/^\\d{4}-\\d{2}-\\d{2}$/.test(v.next_pay_date||"")?v.next_pay_date:"미발표";rates+='<p><a rel="noopener noreferrer" target="_blank" href="'+url+'">'+ticker+' · SmarterDividends 출처</a> / 배당락 '+ex+' / 지급 '+pay+'</p>';}}html+="<section><h3>"+name+"</h3><p>상태: "+String(d.status)+"</p><small>기준일: "+String(d.source_at||"없음")+"</small>"+rates+"</section>";}box.innerHTML=html;}catch(e){box.textContent="조회 실패. 연결 및 Pages 배포 상태를 확인해 주세요.";}}load();</script></body></html>
